# Values of the single phase 1 cell of the DOKS hackweek cluster (NYC1), namespace bbb. That
# install was removed on 2026-10-22; the cluster now runs two cells (doks-hackweek-cell-1.yaml,
# doks-hackweek-cell-2.yaml). Kept as the single-cell example CI renders.
publicHost: bbbk8s-ip-165-245-153-14.bbb.imdt.dev
livekit:
  # Pods reach the media node at its VPC address, not at nodeIP: plain policies by nodeIP would
  # block LiveKit's flows.
  networkPolicy: cilium
  # ExternalIP of the node labelled bbb-k8s/role=media (temp-hackweek-3b3nqq). A replaced node
  # gets a new IP: update it.
  nodeIP: 142.93.115.37
  config:
    rtc:
      # Announce only the media node's public IP and its VPC address (the recorder's path);
      # not the DO anchor, Cilium or CGNAT addresses the node also has.
      ips:
        includes:
          - 142.93.115.37/32
          - 10.116.0.0/20
