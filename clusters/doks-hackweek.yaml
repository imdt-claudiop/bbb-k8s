# Values of the DOKS hackweek cluster (NYC1). Non-secret; written from scripts/public-host.sh
# after the LoadBalancer of svc/bbb-nginx got its IP. A reinstall that recreates the
# LoadBalancer gets a new IP: run the script again and update this line.
publicHost: bbbk8s-ip-165-245-153-14.bbb.imdt.dev
livekit:
  # Pods reach the media node at its VPC address, not at nodeIP: plain policies by nodeIP would
  # block LiveKit's flows.
  networkPolicy: cilium
  # ExternalIP of the node labelled bbb-k8s/role=media (temp-hackweek-3b3nqq). A replaced node
  # gets a new IP: update it.
  nodeIP: 142.93.115.37
  config:
    rtc:
      # Announce only the media node's public IP and its VPC address (the recorder's path);
      # not the DO anchor, Cilium or CGNAT addresses the node also has.
      ips:
        includes:
          - 142.93.115.37/32
          - 10.116.0.0/20
# The cell installed here before the chart supported several cells keeps what it was created
# with: the storage class of a volume claim cannot change, and the load balancer keeps its name.
postgres: { storageClass: do-block-storage-retain }
redis: { storageClass: do-block-storage-retain }
bbbData: { storageClass: do-block-storage-retain }
webrtcRecorder: { storageClass: do-block-storage-retain }
nginx:
  service:
    annotations:
      service.beta.kubernetes.io/do-loadbalancer-name: bbb-k8s
