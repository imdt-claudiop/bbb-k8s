# Values of the DOKS hackweek cluster (NYC1). Non-secret; written from scripts/public-host.sh
# after the LoadBalancer of svc/bbb-nginx got its IP. A reinstall that recreates the
# LoadBalancer gets a new IP: run the script again and update this line.
publicHost: bbbk8s-ip-157-230-202-154.bbb.imdt.dev
livekit:
  # ExternalIP of the node labelled bbb-k8s/role=media (temp-hackweek-3b3nqq). A replaced node
  # gets a new IP: update it.
  nodeIP: 142.93.115.37
  config:
    rtc:
      # Announce only the media node's public IP and its VPC address (the recorder's path);
      # not the DO anchor, Cilium or CGNAT addresses the node also has.
      ips:
        includes:
          - 142.93.115.37/32
          - 10.116.0.0/20
