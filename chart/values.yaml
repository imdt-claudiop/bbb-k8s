# BigBlueButton line this chart packages. Source commit of every image built by images/build.sh.
bbb:
  sourceSha: "66b0bb09591f4d66868f65822d918702ddf389cd"

registry: ghcr.io/imdt-claudiop/bbb-k8s
imagePullSecret: ghcr-pull

# Secrets are created outside the chart (docs/install.md).
secrets:
  db: bbb-db          # keys: postgres-password, bbb-core-password, bbb-hasura-password,
                      #       hasura-app-password, blocknote-app-password
  salt: bbb-salt      # key: security-salt
  hasura: bbb-hasura  # key: admin-secret
  livekit: bbb-livekit  # keys: api-secret, keys.yaml (<apiKey>: <secret>)

# Node roles (spec D1). Label the nodes with  bbb-k8s/role=<role>.
nodeRoleLabel: bbb-k8s/role

postgres:
  image: "postgres:16"
  role: data
  storageClass: do-block-storage-retain
  size: 10Gi
  # bbb-pg.conf of bbb-graphql-server (Hasura may use up to 100 connections).
  maxConnections: 300

redis:
  image: "redis:7.4"
  role: control
  storageClass: do-block-storage-retain
  size: 5Gi

bootstrap:
  # Both written by images/build.sh. schemaSha is the single source of truth for the
  # bbb_graphql marker; it must equal the sha256 of the bbb_schema.sql inside the image.
  tag: "4.1-66b0bb09-b5"
  schemaSha: "ad5626dd845579ffb604e42c76f9f3eb3d91f4b326a0d804bfdbafcb4a7d3cb9"

# Client settings overrides (same keys as settings.yml), the /etc/bigbluebutton/bbb-html5.yml
# of a package install. Without the file akka logs a parse error at boot.
clientSettingsOverride: {}

akkaApps:
  tag: "4.1-66b0bb09-b1"
  role: control
  resources:
    requests: { cpu: 500m, memory: 768Mi }
    limits: { cpu: "1", memory: 1280Mi }
  # bbbWebAPI (base of the breakout join URL) is templated from publicHost in akka-apps.yaml.
  graphqlMiddlewareAPI: "http://gql-middleware:8378"

# --- GraphQL stack (bbb-graphql-server, -actions, -middleware) ------------------------------
hasura:
  tag: "4.1-66b0bb09-s2a"
  role: data          # next to Postgres: the hottest query path (spec D1)
  # hasura-config.env of the bbb-graphql-server package.
  env:
    HASURA_GRAPHQL_LOG_LEVEL: warn
    HASURA_GRAPHQL_ENABLE_CONSOLE: "false"
    HASURA_GRAPHQL_LIVE_QUERIES_MULTIPLEXED_REFETCH_INTERVAL: "333"
    HASURA_GRAPHQL_LIVE_QUERIES_MULTIPLEXED_BATCH_SIZE: "1000"
    HASURA_GRAPHQL_STREAMING_QUERIES_MULTIPLEXED_REFETCH_INTERVAL: "150"
    HASURA_GRAPHQL_STREAMING_QUERIES_MULTIPLEXED_BATCH_SIZE: "1000"
    HASURA_GRAPHQL_ENABLE_TELEMETRY: "false"
    HASURA_GRAPHQL_WEBSOCKET_KEEPALIVE: "10"
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }

hasuraMetadata:
  # Both written by images/build.sh; metadataSha is the content hash of the applied metadata.
  tag: "4.1-66b0bb09-s2a"
  metadataSha: "b862cd128c401d33ca9e62b7c3a4c8684639f257ae50c472403ce01cf8c70d69"

graphqlActions:
  tag: "4.1-66b0bb09-s2a"
  role: control
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

sharedNotes:
  tag: "4.1-66b0bb09-20261020190249"
  role: control
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { cpu: 500m, memory: 512Mi }

exportAnnotations:
  tag: "4.1-66b0bb09-20261020193503"
  # Runs on the storage role (bbbData.role) to read the presentation files on bbb-data.
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

recordingCleanup:
  # Daily at 03:00. Runs the upstream cleanup.rb (intermediate processing files only);
  # published-recording retention stays OFF (a user decision, see recording-cleanup-cronjob.yaml).
  schedule: "0 3 * * *"

graphqlMiddleware:
  tag: "4.1-66b0bb09-s2a"
  role: control
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

# --- Front: bbb-web, nginx (html5 client, learning dashboard) -------------------------------
# Host every URL of the client and the API derives from (bigbluebutton.web.serverURL) and the
# name the front nginx answers to; must be covered by the TLS Secret. Set per cluster (e.g.
# clusters/doks-hackweek.yaml): <prefix>-ip-<LB IP with dashes>.bbb.imdt.dev, which public DNS
# resolves to the LoadBalancer IP (scripts/public-host.sh). No default on purpose.
publicHost: ""

bbbData:
  storageClass: do-block-storage-retain
  size: 20Gi
  role: storage       # every pod that mounts /var/bigbluebutton runs here (spec D2)

bbbWeb:
  tag: "4.1-66b0bb09-s3a"
  # Extra lines for /etc/bigbluebutton/bbb-web.properties (securitySalt comes from the Secret).
  properties: {}
  resources:
    requests: { cpu: "1", memory: 1536Mi }
    limits: { cpu: "2", memory: 3Gi }

nginx:
  tag: "4.1-66b0bb09-20261020184652"
  tlsSecret: bbb-tls  # kubernetes.io/tls, created by scripts/create-secrets.sh
  # Public entry point: a DigitalOcean LoadBalancer in TCP mode in front of this nginx, which
  # terminates TLS itself (docs/install.md, "Public entry point").
  service:
    type: LoadBalancer
    # Local: the LB only sends to the node running nginx and the client IP is preserved, which
    # is what lets the NetworkPolicy ipBlock admit external clients.
    externalTrafficPolicy: Local
    annotations:
      service.beta.kubernetes.io/do-loadbalancer-name: bbb-k8s
      service.beta.kubernetes.io/do-loadbalancer-size-unit: "1"
      service.beta.kubernetes.io/do-loadbalancer-healthcheck-protocol: tcp
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

# --- Media: LiveKit, bbb-webrtc-sfu (LiveKit module only), bbb-webrtc-recorder ----------------
livekit:
  image: "livekit/livekit-server:v1.9.12"   # the version the bbb-livekit package builds
  role: media
  # Public IP of the media node, announced in ICE candidates (spec D4). Set per cluster.
  nodeIP: ""
  # Key id (not a secret: it travels in every token header); the secret is in bbb-livekit.
  apiKey: bbbk8s
  # Overrides merged over the package's livekit.yaml (chart/files/livekit.yaml).
  config:
    rtc:
      # Media reaches the node over UDP 16384-32768 for most clients (ICE opens the path; the
      # DO firewall is stateful) and falls back to ICE-TCP on 443 for clients whose UDP is
      # blocked. See docs/install.md "What the DOKS firewall lets through".
      tcp_port: 443
      allow_tcp_fallback: true
      # Pods cannot reach a node's public IP (measured: TCP to the media node's public IP times
      # out from any pod, its VPC IP answers), and bbb-webrtc-recorder joins rooms from inside
      # the cluster. With use_external_ip LiveKit maps the public interface through STUN and
      # keeps the VPC address as a host candidate, which the recorder can use; external
      # clients still get the public one. node_ip stays as the fallback.
      use_external_ip: true
  resources:
    requests: { cpu: "1", memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }

webrtcSfu:
  tag: "4.1-66b0bb09-s5a"
  role: media
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

webrtcRecorder:
  tag: "4.1-66b0bb09-s5a"
  storageClass: do-block-storage-retain
  size: 20Gi
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

# --- Recording (record-and-playback: rap-starter + resque workers, presentation format) -------
recording:
  tag: "4.1-66b0bb09-s6b"
  # Overrides merged over the package's bigbluebutton.yml (chart/files/bigbluebutton.yml).
  config: {}
  # Spec 3.3: 1 CPU / 1 Gi requested for the pod, ffmpeg bursts up to 3 CPU / 3 Gi. The storage
  # node also runs bbb-web, nginx and the recorder, so the requests are sized to fit beside them.
  resources:
    rapStarter:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
    resqueWorker:
      requests: { cpu: 750m, memory: 896Mi }
      limits: { cpu: "3", memory: 3Gi }
