# BigBlueButton line this chart packages: the monorepo commit the official images were built
# from. chart/files/{settings.yml,bigbluebutton.yml,livekit.yaml,nginx/} and bootstrap.schemaSha
# come from the same commit (scripts/sync-upstream.sh writes them all).
bbb:
  sourceSha: "5b80a5ba64442b43246e4708cecd751b905d91a4"

# The official images (docker/README.md of the monorepo): <registry>/bbb-<target>:<tag>. The tag
# is the immutable per-commit one CI publishes (<branch>-<sha7>), never the moving branch tag.
officialImages:
  registry: ghcr.io/bigbluebutton/bigbluebutton
  tag: "v4.1.x-develop-5b80a5b"

# Secrets are created outside the chart (docs/install.md).
secrets:
  db: bbb-db          # keys: postgres-password, bbb-core-password, bbb-hasura-password,
                      #       hasura-app-password, blocknote-app-password
  salt: bbb-salt      # key: security-salt
  hasura: bbb-hasura  # key: admin-secret
  livekit: bbb-livekit  # keys: api-secret, keys.yaml (<apiKey>: <secret>)
  # Optional: a Secret with key ca.crt (PEM), a certificate authority that bbb-web and helm test
  # trust in addition to the public ones. For a TLS certificate signed by a local CA, whose
  # public host bbb-web downloads from (the default presentation) and helm test calls; a local
  # test install (docs/k3s.md). Empty: only the public CAs.
  extraCA: ""

# Node roles (spec D1). Label the nodes with  bbb-k8s/role=<role>.
nodeRoleLabel: bbb-k8s/role

# Several cells in one cluster: each one is a release in its own namespace on its own nodes.
# With `cell` set, every pod of the release also selects the nodes labelled
# <cellLabel>=<cell> and tolerates the taint <cellLabel>=<cell>:NoSchedule, which keeps other
# workloads off them. Label and taint the cell's node pool with both (docs/doks.md). Empty: no
# cell label, the pods go by role only (a cluster with a single cell, docs/k3s.md).
cellLabel: bbb-k8s/cell
cell: ""

postgres:
  image: "postgres:16"
  role: data
  storageClass: do-block-storage
  size: 10Gi
  # bbb-pg.conf of bbb-graphql-server (Hasura may use up to 100 connections).
  maxConnections: 300

redis:
  image: "redis:7.4"
  role: control
  storageClass: do-block-storage
  size: 5Gi

bootstrap:
  # sha256 of bbb-graphql-server/bbb_schema.sql at bbb.sourceSha, written by
  # scripts/sync-upstream.sh: the single source of truth for the bbb_graphql marker. The Job
  # checks it against the schema of the graphql-server image.
  schemaSha: "ad5626dd845579ffb604e42c76f9f3eb3d91f4b326a0d804bfdbafcb4a7d3cb9"

# Client settings overrides (same keys as settings.yml), the /etc/bigbluebutton/bbb-html5.yml
# of a package install. Without the file akka logs a parse error at boot.
clientSettingsOverride: {}

akkaApps:
  role: control
  resources:
    requests: { cpu: 500m, memory: 768Mi }
    limits: { cpu: "1", memory: 1280Mi }
  # bbbWebAPI (base of the breakout join URL) is templated from publicHost in akka-apps.yaml.
  graphqlMiddlewareAPI: "http://gql-middleware:8378"

# --- GraphQL stack (bbb-graphql-server, -actions, -middleware) ------------------------------
hasura:
  role: data          # next to Postgres: the hottest query path (spec D1)
  # hasura-config.env of the bbb-graphql-server package.
  env:
    HASURA_GRAPHQL_LOG_LEVEL: warn
    HASURA_GRAPHQL_ENABLE_CONSOLE: "false"
    HASURA_GRAPHQL_LIVE_QUERIES_MULTIPLEXED_REFETCH_INTERVAL: "333"
    HASURA_GRAPHQL_LIVE_QUERIES_MULTIPLEXED_BATCH_SIZE: "1000"
    HASURA_GRAPHQL_STREAMING_QUERIES_MULTIPLEXED_REFETCH_INTERVAL: "150"
    HASURA_GRAPHQL_STREAMING_QUERIES_MULTIPLEXED_BATCH_SIZE: "1000"
    HASURA_GRAPHQL_ENABLE_TELEMETRY: "false"
    HASURA_GRAPHQL_WEBSOCKET_KEEPALIVE: "10"
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }


graphqlActions:
  role: control
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

sharedNotes:
  role: control
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { cpu: 500m, memory: 512Mi }

exportAnnotations:
  # Runs on the storage role (bbbData.role) to read the presentation files on bbb-data.
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

recordingCleanup:
  # Daily at 03:00. Runs the upstream cleanup.rb (intermediate processing files only);
  # published-recording retention stays OFF (a user decision, see recording-cleanup-cronjob.yaml).
  schedule: "0 3 * * *"

webhooks:
  role: control
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

graphqlMiddleware:
  role: control
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

# --- Front: bbb-web, nginx and the static apps (html5 client, learning dashboard, player) ----
# Host every URL of the client and the API derives from (bigbluebutton.web.serverURL) and the
# name the front nginx answers to; must be covered by the TLS Secret and resolve to the
# LoadBalancer IP on public DNS (scripts/public-host.sh checks it). Set per cluster, e.g. in
# clusters/<cluster>.yaml (docs/install.md "Install"). No default on purpose.
publicHost: ""

bbbData:
  storageClass: do-block-storage
  size: 20Gi
  role: storage       # every pod that mounts /var/bigbluebutton runs here (spec D2)

bbbWeb:
  # Extra lines for /etc/bigbluebutton/bbb-web.properties (securitySalt comes from the Secret).
  properties: {}
  resources:
    requests: { cpu: "1", memory: 1536Mi }
    limits: { cpu: "2", memory: 3Gi }

nginx:
  tlsSecret: bbb-tls  # kubernetes.io/tls, created by scripts/create-secrets.sh
  # Public entry point: a DigitalOcean LoadBalancer in TCP mode in front of this nginx, which
  # terminates TLS itself (docs/install.md, "Public entry point").
  service:
    type: LoadBalancer
    # Local: the LB only sends to the node running nginx and the client IP is preserved, which
    # is what lets the NetworkPolicy ipBlock admit external clients.
    externalTrafficPolicy: Local
    # The load balancer's name is bbb-k8s-<namespace> (one per cell); set
    # service.beta.kubernetes.io/do-loadbalancer-name here to choose another.
    annotations:
      service.beta.kubernetes.io/do-loadbalancer-size-unit: "1"
      service.beta.kubernetes.io/do-loadbalancer-healthcheck-protocol: tcp
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

# The html5 client, learning dashboard and presentation player images (static-apps.yaml).
staticApps:
  role: control
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

# --- Media: LiveKit, bbb-webrtc-sfu (LiveKit module only), bbb-webrtc-recorder ----------------
livekit:
  image: "livekit/livekit-server:v1.9.12"   # the version the bbb-livekit package builds
  role: media
  # Public IP of the media node, announced in ICE candidates (spec D4). Set per cluster.
  nodeIP: ""
  # Key id (not a secret: it travels in every token header); the secret is in bbb-livekit.
  apiKey: bbbk8s
  # How the network policies admit LiveKit's flows (it runs on the host network, which plain
  # podSelectors cannot match): cilium = CiliumNetworkPolicies by node entity; plain =
  # NetworkPolicies by livekit.nodeIP (exact where pods reach the media node at that address, as
  # on one machine); auto = cilium when the cluster serves cilium.io/v2/CiliumNetworkPolicy, plain
  # otherwise. A render without the cluster (helm template, GitOps) cannot ask: set cilium or plain.
  networkPolicy: auto
  # Overrides merged over the package's livekit.yaml (chart/files/livekit.yaml).
  config:
    rtc:
      # Media reaches the node over UDP 16384-32768 for most clients (ICE opens the path; the
      # DO firewall is stateful) and falls back to ICE-TCP on 443 for clients whose UDP is
      # blocked. See docs/install.md "What the DOKS firewall lets through".
      tcp_port: 443
      allow_tcp_fallback: true
      # Pods cannot reach a node's public IP (measured: TCP to the media node's public IP times
      # out from any pod, its VPC IP answers), and bbb-webrtc-recorder joins rooms from inside
      # the cluster. With use_external_ip LiveKit maps the public interface through STUN and
      # keeps the VPC address as a host candidate, which the recorder can use; external
      # clients still get the public one. node_ip stays as the fallback.
      use_external_ip: true
  resources:
    requests: { cpu: "1", memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }

webrtcSfu:
  role: media
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

webrtcRecorder:
  storageClass: do-block-storage
  size: 20Gi
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

# --- Recording (record-and-playback: rap-starter + resque workers) ----------------------------
recording:
  # Overrides merged over the package's bigbluebutton.yml (chart/files/bigbluebutton.yml).
  config: {}
  # Recording delivery to a Scalelite spool (phase 2 spec, "Recordings"). Off while spool.host
  # is empty. When set, Scalelite's own post_publish script
  # (chart/files/scalelite/scalelite_post_publish.rb, verbatim from blindsidenetworks/scalelite
  # v1.8.6; the Servers API needs Scalelite >= 1.5.1) packs the published formats of each
  # recording into a tar and drops it in /var/bigbluebutton/spool; a sidecar rsyncs every tar
  # over SSH to spool.host:spool.path and removes it on success. The copy runs in a sidecar
  # because the official record-and-playback image ships rsync but no SSH client (verified on
  # v4.1.x-develop-5b80a5b); adding the client upstream is the durable path, the sidecar is the
  # bridge. delete_recording stays off: the script's delete calls bbb-record, which the image
  # does not have (deleting after delivery is phase 3).
  scalelite:
    spool:
      host: ""          # [user@]host that receives the tars (Scalelite's recording import spool)
      path: ""          # absolute spool directory on that host
      # Where the egress rule points. A spool OUTSIDE the cluster: cidr, the host as a CIDR
      # (e.g. 203.0.113.10/32). A spool INSIDE the cluster (host is a Service name):
      # namespace, the spool's namespace - CIDR rules do not match in-cluster destinations
      # under Cilium (measured on DOKS: the ipBlock rule never opened), the namespace peer
      # does. Set one of the two.
      cidr: ""
      namespace: ""
      port: 22
    # Secret the operator creates: key id = SSH private key (shared by the cells; the server
    # side restricts it to the spool directory, write-only, e.g. rrsync); optional key
    # known_hosts pins the host key (absent: accept-new on first contact).
    sshKeySecret: scalelite-spool-ssh
    transferImage: "instrumentisto/rsync-ssh:alpine3.22"
    transferResources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }
  # Spec 3.3: 1 CPU / 1 Gi requested for the pod, ffmpeg bursts up to 3 CPU / 3 Gi. The storage
  # node also runs bbb-web, nginx and the recorder, so the requests are sized to fit beside them.
  resources:
    rapStarter:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
    resqueWorker:
      requests: { cpu: 750m, memory: 896Mi }
      limits: { cpu: "3", memory: 3Gi }
