apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "bbb.selector" "redis" | nindent 4 }}
  ports:
    - name: redis
      port: 6379
---
# Redis is state, not only a bus (Resque queues, exportJobs, 14 days of recording events):
# AOF on a persistent volume (spec D3). No password: graphql-actions cannot use one yet,
# access is restricted by NetworkPolicy.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
    {{- include "bbb.selector" "redis" | nindent 4 }}
spec:
  serviceName: redis
  replicas: 1
  # The volume goes with the release: helm uninstall deletes the claim (the storage class
  # decides whether the cloud volume goes too).
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "bbb.selector" "redis" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bbb.labels" . | nindent 8 }}
        {{- include "bbb.selector" "redis" | nindent 8 }}
    spec:
      {{- include "bbb.nodeSelector" (dict "root" . "role" .Values.redis.role) | nindent 6 }}
      securityContext:
        fsGroup: 999
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["--appendonly", "yes", "--dir", "/data"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 500m, memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.redis.storageClass }}
        resources:
          requests:
            storage: {{ .Values.redis.size }}
