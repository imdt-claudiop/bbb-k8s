# A ClusterIP, not a headless Service: the name resolves before redis-0 is ready and keeps its
# address when the pod is recreated, which matters for clients that cache resolved addresses
# (the JVMs). It is also the StatefulSet's serviceName (immutable); nothing uses the per-pod DNS
# names.
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "bbb.selector" "redis" | nindent 4 }}
  ports:
    - name: redis
      port: 6379
---
# Redis is state, not only a bus (Resque queues, exportJobs, 14 days of recording events):
# AOF on a persistent volume (spec D3). No password: graphql-actions cannot use one yet,
# access is restricted by NetworkPolicy.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
    {{- include "bbb.selector" "redis" | nindent 4 }}
  annotations:
    ignore-check.kube-linter.io/run-as-non-root: "the image entrypoint chowns /data as root, then drops to redis"
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "bbb.selector" "redis" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bbb.podLabels" . | nindent 8 }}
        {{- include "bbb.selector" "redis" | nindent 8 }}
    spec:
      {{- include "bbb.placement" (dict "root" . "role" .Values.redis.role) | nindent 6 }}
      {{- include "bbb.podDefaults" . | nindent 6 }}
      {{- include "bbb.podSecurityContext" (dict "fsGroup" 999) | nindent 6 }}
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["--appendonly", "yes", "--dir", "/data",
                 "--maxmemory", {{ .Values.redis.maxmemory | quote }}, "--maxmemory-policy", "noeviction"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          # The entrypoint runs as root (chown of /data, then gosu), so the default capabilities
          # stay, minus NET_RAW.
          {{- include "bbb.containerSecurity" (dict "root" . "drop" (list "NET_RAW")) | nindent 10 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.redis.storageClass }}
        resources:
          requests:
            storage: {{ .Values.redis.size }}
