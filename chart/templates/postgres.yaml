# A ClusterIP, not a headless Service: the name resolves before postgres-0 is ready and keeps its
# address when the pod is recreated, so clients never see "no such host" or a stale pod IP. It
# is also the StatefulSet's serviceName (immutable); nothing uses the per-pod DNS names.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "bbb.selector" "postgres" | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
    {{- include "bbb.selector" "postgres" | nindent 4 }}
  annotations:
    ignore-check.kube-linter.io/run-as-non-root: "the image entrypoint prepares PGDATA as root, then drops to postgres"
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "bbb.selector" "postgres" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bbb.podLabels" . | nindent 8 }}
        {{- include "bbb.selector" "postgres" | nindent 8 }}
    spec:
      {{- include "bbb.placement" (dict "root" . "role" .Values.postgres.role) | nindent 6 }}
      {{- include "bbb.podDefaults" . | nindent 6 }}
      {{- include "bbb.podSecurityContext" (dict "fsGroup" 999) | nindent 6 }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          args: ["-c", "max_connections={{ .Values.postgres.maxConnections }}"]
          env:
            {{- include "bbb.dbPasswordEnv" (dict "root" . "env" "POSTGRES_PASSWORD" "key" "postgres-password") | nindent 12 }}
            # the block volume root holds lost+found
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          # The entrypoint runs as root (chown of PGDATA, then gosu), so the default capabilities
          # stay, minus NET_RAW.
          {{- include "bbb.containerSecurity" (dict "root" . "drop" (list "NET_RAW")) | nindent 10 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- include "bbb.scratch" (dict "name" "run" "size" "16Mi") | nindent 8 }}
        {{- include "bbb.scratch" (dict "name" "tmp" "size" "256Mi") | nindent 8 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.postgres.storageClass }}
        resources:
          requests:
            storage: {{ .Values.postgres.size }}
