# Default-deny in the namespace, then named allows (spec D6). Several BBB surfaces have no
# authentication of their own (graphql-actions, the notes /loopback, akka /analytics), so every
# flow is listed explicitly. Later slices add their own allows here.
{{- define "bbb.peer" -}}
- podSelector:
    matchLabels:
      {{- include "bbb.selector" . | nindent 6 }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bbb.selector" "postgres" | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        {{- include "bbb.peer" "bootstrap" | nindent 8 }}
        {{- include "bbb.peer" "akka-apps" | nindent 8 }}
      ports:
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bbb.selector" "redis" | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        {{- include "bbb.peer" "akka-apps" | nindent 8 }}
      ports:
        - { protocol: TCP, port: 6379 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bootstrap
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bbb.selector" "bootstrap" | nindent 6 }}
  policyTypes: ["Egress"]
  egress:
    - to:
        {{- include "bbb.peer" "postgres" | nindent 8 }}
      ports:
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: akka-apps
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bbb.selector" "akka-apps" | nindent 6 }}
  policyTypes: ["Egress"]
  egress:
    - to:
        {{- include "bbb.peer" "postgres" | nindent 8 }}
      ports:
        - { protocol: TCP, port: 5432 }
    - to:
        {{- include "bbb.peer" "redis" | nindent 8 }}
      ports:
        - { protocol: TCP, port: 6379 }
