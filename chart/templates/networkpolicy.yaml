# Default-deny in the namespace, then named allows (spec D6). Several BBB surfaces have no
# authentication of their own (graphql-actions, the notes /loopback, akka /analytics), so every
# flow is listed explicitly. Each workload gets one policy with its ingress and egress.
{{- define "bbb.peer" -}}
- podSelector:
    matchLabels:
      {{- include "bbb.selector" . | nindent 6 }}
{{- end }}
{{- /* bbb.netpol: dict name, ingress: [[port, [peers]]], egress: [[port, [peers]]] */}}
{{- define "bbb.netpol" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .name }}
  labels:
    {{- include "bbb.labels" .root | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bbb.selector" .name | nindent 6 }}
  policyTypes:
    {{- if .ingress }}
    - Ingress
    {{- end }}
    {{- if .egress }}
    - Egress
    {{- end }}
  {{- with .ingress }}
  ingress:
    {{- range . }}
    - from:
        {{- range (index . 1) }}
        {{- include "bbb.peer" . | nindent 8 }}
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ index . 0 }} }
    {{- end }}
  {{- end }}
  {{- with .egress }}
  egress:
    {{- range . }}
    - to:
        {{- range (index . 1) }}
        {{- include "bbb.peer" . | nindent 8 }}
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ index . 0 }} }
    {{- end }}
  {{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
{{- include "bbb.netpol" (dict "root" . "name" "postgres"
      "ingress" (list (list 5432 (list "bootstrap" "akka-apps" "hasura" "hasura-metadata" "bbb-shared-notes")))) }}
{{- include "bbb.netpol" (dict "root" . "name" "redis"
      "ingress" (list (list 6379 (list "akka-apps" "gql-actions" "gql-middleware" "bbb-web"
                                       "bbb-webrtc-sfu" "bbb-webrtc-recorder" "recording" "bbb-shared-notes"
                                       "bbb-export-annotations" "recording-cleanup")))) }}
{{- include "bbb.netpol" (dict "root" . "name" "bbb-shared-notes"
      "ingress" (list (list 8787 (list "bbb-nginx")))
      "egress" (list (list 5432 (list "postgres")) (list 6379 (list "redis")) (list 8090 (list "bbb-web")))) }}
{{- include "bbb.netpol" (dict "root" . "name" "bbb-export-annotations"
      "egress" (list (list 6379 (list "redis")) (list 8090 (list "bbb-web")))) }}
{{- include "bbb.netpol" (dict "root" . "name" "recording-cleanup"
      "egress" (list (list 6379 (list "redis")))) }}
{{- include "bbb.netpol" (dict "root" . "name" "bootstrap"
      "egress" (list (list 5432 (list "postgres")))) }}
{{- include "bbb.netpol" (dict "root" . "name" "akka-apps"
      "ingress" (list (list 8901 (list "hasura" "gql-middleware")))
      "egress" (list (list 5432 (list "postgres")) (list 6379 (list "redis")) (list 8378 (list "gql-middleware"))
                     (list 8090 (list "bbb-web")))) }}
{{- include "bbb.netpol" (dict "root" . "name" "hasura"
      "ingress" (list (list 8085 (list "gql-middleware" "hasura-metadata" "bbb-nginx")))
      "egress" (list (list 5432 (list "postgres")) (list 8901 (list "akka-apps")) (list 8093 (list "gql-actions")))) }}
{{- include "bbb.netpol" (dict "root" . "name" "hasura-metadata"
      "egress" (list (list 5432 (list "postgres")) (list 8085 (list "hasura")))) }}
{{- include "bbb.netpol" (dict "root" . "name" "gql-actions"
      "ingress" (list (list 8093 (list "hasura" "gql-middleware")))
      "egress" (list (list 6379 (list "redis")))) }}
{{- include "bbb.netpol" (dict "root" . "name" "gql-middleware"
      "ingress" (list (list 8378 (list "akka-apps" "bbb-nginx")))
      "egress" (list (list 6379 (list "redis")) (list 8085 (list "hasura")) (list 8093 (list "gql-actions"))
                     (list 8901 (list "akka-apps")) (list 8090 (list "bbb-web")))) }}
{{- include "bbb.netpol" (dict "root" . "name" "bbb-nginx"
      "egress" (list (list 8090 (list "bbb-web")) (list 8378 (list "gql-middleware")) (list 8085 (list "hasura"))
                     (list 3008 (list "bbb-webrtc-sfu")) (list 8787 (list "bbb-shared-notes")))) }}
---
# Public entry: the DigitalOcean LoadBalancer forwards clients to nginx with their own source IP
# (externalTrafficPolicy Local), so an ipBlock admits them. bbb-web also reaches nginx through
# the public host when it downloads the default presentation.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bbb-nginx-public
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bbb.selector" "bbb-nginx" | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
        {{- include "bbb.peer" "bbb-web" | nindent 8 }}
      ports:
        - { protocol: TCP, port: 8443 }
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bbb-web
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bbb.selector" "bbb-web" | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        {{- include "bbb.peer" "bbb-nginx" | nindent 8 }}
        {{- include "bbb.peer" "gql-middleware" | nindent 8 }}
        {{- include "bbb.peer" "akka-apps" | nindent 8 }}
        {{- include "bbb.peer" "bbb-shared-notes" | nindent 8 }}
        {{- include "bbb.peer" "bbb-export-annotations" | nindent 8 }}
      ports:
        - { protocol: TCP, port: 8090 }
  egress:
    - to:
        {{- include "bbb.peer" "redis" | nindent 8 }}
      ports:
        - { protocol: TCP, port: 6379 }
    # https://<publicHost>/default.pdf (bigbluebutton.properties defaultUploadedPresentation):
    # Cilium resolves a pod's connection to the LoadBalancer IP in the cluster, so it reaches
    # nginx directly from the pod IP (observed in the nginx access log), never the public path.
    - to:
        {{- include "bbb.peer" "bbb-nginx" | nindent 8 }}
      ports:
        - { protocol: TCP, port: 8443 }
{{- include "bbb.netpol" (dict "root" . "name" "bbb-webrtc-sfu"
      "ingress" (list (list 3008 (list "bbb-nginx")))
      "egress" (list (list 6379 (list "redis")))) }}
{{- include "bbb.netpol" (dict "root" . "name" "bbb-webrtc-recorder"
      "egress" (list (list 6379 (list "redis")))) }}
{{- include "bbb.netpol" (dict "root" . "name" "recording"
      "egress" (list (list 6379 (list "redis")))) }}
---
# livekit-server runs with hostNetwork, so it carries the node identity and plain NetworkPolicy
# podSelectors never match it. These Cilium policies name the node entities instead, only on
# the ports LiveKit uses. They add to the NetworkPolicies above (allows are a union).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: livekit-signaling-clients
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["bbb-nginx", "bbb-webrtc-sfu", "bbb-webrtc-recorder"]
  egress:
    - toEntities: ["host", "remote-node"]
      toPorts:
        - ports:
            - { port: "7880", protocol: TCP }
---
# The recorder joins LiveKit rooms as a WebRTC client and connects to the media node's
# announced public IP: ICE-TCP 443 today, the UDP range once the firewall admits it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: bbb-webrtc-recorder-media
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "bbb.selector" "bbb-webrtc-recorder" | nindent 6 }}
  egress:
    - toEntities: ["host", "remote-node", "world"]
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
            - { port: "16384", endPort: 32768, protocol: UDP }
---
# LiveKit's own connections into the cluster: Redis (routing) and the SFU webhook.
{{- range $target := list (list "redis" "6379") (list "bbb-webrtc-sfu" "3040") }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ index $target 0 }}-from-livekit-node
  labels:
    {{- include "bbb.labels" $ | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "bbb.selector" (index $target 0) | nindent 6 }}
  ingress:
    - fromEntities: ["host", "remote-node"]
      toPorts:
        - ports:
            - { port: {{ index $target 1 | quote }}, protocol: TCP }
{{- end }}
