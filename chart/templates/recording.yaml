{{- /* The package's bigbluebutton.yml with the cluster wiring. Several rap scripts read this file
       directly instead of the recording.yml override, so the full merged
       file is mounted over it, and also as the override. */}}
{{- $config := .Files.Get "files/bigbluebutton.yml" | fromYaml }}
{{- $wiring := dict
      "redis_host" "redis"
      "playback_host" (include "bbb.publicHost" .)
      "bn_notes_endpoint" "http://shared-notes:8787/loopback/api/documents" }}
{{- $config = mergeOverwrite $config $wiring (deepCopy .Values.recording.config) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: recording-config
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
data:
  bigbluebutton.yml: |
    {{- toYaml $config | nindent 4 }}
---
# Recording processing (docs/phase1.md, section 8): one pod, two containers - rap-starter watches the
# status files bbb-web writes and enqueues jobs; the resque workers archive, process and
# publish. Both need the two volumes of the storage node (the inotify trigger works only on the
# same filesystem, spec D2).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recording
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
    {{- include "bbb.selector" "recording" | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "bbb.selector" "recording" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bbb.labels" . | nindent 8 }}
        {{- include "bbb.selector" "recording" | nindent 8 }}
      annotations:
        bbb-k8s/config-sha: {{ toYaml $config | sha256sum | trunc 16 | quote }}
    spec:
      {{- include "bbb.nodeSelector" (dict "root" . "role" .Values.bbbData.role) | nindent 6 }}
      securityContext:
        runAsUser: 998
        runAsGroup: 998
        fsGroup: 998
      initContainers:
        {{- include "bbb.waitRedis" . | nindent 8 }}
        # What the package postinsts set up and the official image keeps in its own filesystem,
        # hidden here by the mounts: the directory tree on bbb-data, the per-format log folders,
        # and bbb-web.properties with securitySalt, which the recording-ready callback reads. The
        # file is mounted by itself so the image's /etc/bigbluebutton/bigbluebutton-release
        # stays visible.
        - name: setup
          image: {{ include "bbb.officialImage" (dict "root" . "name" "record-and-playback") }}
          command:
            - sh
            - -c
            - |
              set -e
              printf 'securitySalt=%s\n' "$SHARED_SECRET" > /props/bbb-web.properties
              mkdir -p /var/log/bigbluebutton/presentation /var/log/bigbluebutton/video /var/log/bigbluebutton/notes /var/log/bigbluebutton/screenshare
              {{ include "bbb.dataTree" . }}
          env:
            - name: SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.salt }}
                  key: security-salt
          volumeMounts:
            - name: props
              mountPath: /props
            - name: data
              mountPath: /var/bigbluebutton
            - name: logs
              mountPath: /var/log/bigbluebutton
      containers:
        {{- range $c := list (dict "name" "rap-starter" "res" "rapStarter" "args" (list "bundle" "exec" "ruby" "rap-starter.rb"))
                             (dict "name" "resque-worker" "res" "resqueWorker" "args" (list "bundle" "exec" "rake" "-f" "Rakefile" "resque:workers")) }}
        - name: {{ $c.name }}
          image: {{ include "bbb.officialImage" (dict "root" $ "name" "record-and-playback") }}
          # The image runs the resque workers by default (QUEUE and COUNT of
          # bbb-rap-resque-worker.service preset); rap-starter is the other process of the image.
          args: {{ toJson $c.args }}
          resources:
            {{- toYaml (index $.Values.recording.resources $c.res) | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/bigbluebutton
            - name: recordings
              mountPath: /var/lib/bbb-webrtc-recorder
            - name: config
              mountPath: /usr/local/bigbluebutton/core/scripts/bigbluebutton.yml
              subPath: bigbluebutton.yml
            - name: config
              mountPath: /etc/bigbluebutton/recording/recording.yml
              subPath: bigbluebutton.yml
            - name: props
              mountPath: /etc/bigbluebutton/bbb-web.properties
              subPath: bbb-web.properties
              readOnly: true
            - name: logs
              mountPath: /var/log/bigbluebutton
            - name: tmp
              mountPath: /tmp
        {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bbb-data
        - name: recordings
          persistentVolumeClaim:
            claimName: bbb-recorder
        - name: config
          configMap:
            name: recording-config
        - name: props
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
