{{- /* The package's bigbluebutton.yml with the cluster wiring. Several rap scripts read this file
       directly instead of the recording.yml override, so the full merged
       file is mounted over it, and also as the override. */}}
{{- $config := .Files.Get "files/bigbluebutton.yml" | fromYaml }}
{{- $wiring := dict
      "redis_host" "redis"
      "playback_host" (include "bbb.publicHost" .)
      "bn_notes_endpoint" "http://shared-notes:8787/loopback/api/documents" }}
{{- $config = mergeOverwrite $config $wiring (deepCopy .Values.recording.config) }}
{{- /* Recording delivery to a Scalelite spool (phase 2 spec, "Recordings"), on when
       recording.scalelite.spool.host is set; see the comment in values.yaml. */}}
{{- $spool := .Values.recording.scalelite.spool }}
{{- $delivery := ne ($spool.host | default "" | toString) "" }}
{{- $scaleliteConfig := dict
      "work_dir" "/var/bigbluebutton/recording/scalelite"
      "spool_dir" "/var/bigbluebutton/spool"
      "extra_rsync_opts" (list)
      "delete_recording" false }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: recording-config
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
data:
  bigbluebutton.yml: |
    {{- toYaml $config | nindent 4 }}
  {{- if $delivery }}
  # The script reads scalelite.yml next to the scripts dir; spool_dir is the local handoff on
  # bbb-data, where the sidecar picks the tar up. Verbatim upstream script below it.
  scalelite.yml: |
    {{- toYaml $scaleliteConfig | nindent 4 }}
  scalelite_post_publish.rb: |
    {{- .Files.Get "files/scalelite/scalelite_post_publish.rb" | nindent 4 }}
  {{- end }}
---
# Recording processing (docs/phase1.md, section 8): one pod, two containers - rap-starter watches the
# status files bbb-web writes and enqueues jobs; the resque workers archive, process and
# publish. Both need the two volumes of the storage node (the inotify trigger works only on the
# same filesystem, spec D2).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recording
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
    {{- include "bbb.selector" "recording" | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "bbb.selector" "recording" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bbb.labels" . | nindent 8 }}
        {{- include "bbb.selector" "recording" | nindent 8 }}
      annotations:
        {{- /* With delivery off the input is the config alone, so the sha (and the pods) do
             not move on an upgrade from a release without delivery. */}}
        {{- $shaInput := toYaml $config }}
        {{- if $delivery }}
        {{- $shaInput = printf "%s%s" $shaInput (toYaml $scaleliteConfig) }}
        {{- end }}
        bbb-k8s/config-sha: {{ $shaInput | sha256sum | trunc 16 | quote }}
    spec:
      {{- include "bbb.nodeSelector" (dict "root" . "role" .Values.bbbData.role) | nindent 6 }}
      securityContext:
        runAsUser: 998
        runAsGroup: 998
        fsGroup: 998
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        {{- include "bbb.waitRedis" . | nindent 8 }}
        # What the package postinsts set up and the official image keeps in its own filesystem,
        # hidden here by the mounts: the directory tree on bbb-data, the per-format log folders,
        # and bbb-web.properties with securitySalt, which the recording-ready callback reads. The
        # file is mounted by itself so the image's /etc/bigbluebutton/bigbluebutton-release
        # stays visible.
        - name: setup
          image: {{ include "bbb.officialImage" (dict "root" . "name" "record-and-playback") }}
          command:
            - sh
            - -c
            - |
              set -e
              printf 'securitySalt=%s\n' "$SHARED_SECRET" > /props/bbb-web.properties
              mkdir -p /var/log/bigbluebutton/presentation /var/log/bigbluebutton/video /var/log/bigbluebutton/notes /var/log/bigbluebutton/screenshare
              {{ include "bbb.dataTree" . }}
              {{- if $delivery }}
              mkdir -p /var/bigbluebutton/spool /var/bigbluebutton/recording/scalelite
              {{- end }}
          env:
            - name: SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.salt }}
                  key: security-salt
          volumeMounts:
            - name: props
              mountPath: /props
            - name: data
              mountPath: /var/bigbluebutton
            - name: logs
              mountPath: /var/log/bigbluebutton
      containers:
        {{- range $c := list (dict "name" "rap-starter" "res" "rapStarter" "args" (list "bundle" "exec" "ruby" "rap-starter.rb"))
                             (dict "name" "resque-worker" "res" "resqueWorker" "args" (list "bundle" "exec" "rake" "-f" "Rakefile" "resque:workers")) }}
        - name: {{ $c.name }}
          image: {{ include "bbb.officialImage" (dict "root" $ "name" "record-and-playback") }}
          # The image runs the resque workers by default (QUEUE and COUNT of
          # bbb-rap-resque-worker.service preset); rap-starter is the other process of the image.
          args: {{ toJson $c.args }}
          resources:
            {{- toYaml (index $.Values.recording.resources $c.res) | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/bigbluebutton
            - name: recordings
              mountPath: /var/lib/bbb-webrtc-recorder
            - name: config
              mountPath: /usr/local/bigbluebutton/core/scripts/bigbluebutton.yml
              subPath: bigbluebutton.yml
            - name: config
              mountPath: /etc/bigbluebutton/recording/recording.yml
              subPath: bigbluebutton.yml
            {{- if $delivery }}
            - name: config
              mountPath: /usr/local/bigbluebutton/core/scripts/scalelite.yml
              subPath: scalelite.yml
            - name: config
              mountPath: /usr/local/bigbluebutton/core/scripts/post_publish/scalelite_post_publish.rb
              subPath: scalelite_post_publish.rb
            {{- end }}
            - name: props
              mountPath: /etc/bigbluebutton/bbb-web.properties
              subPath: bbb-web.properties
              readOnly: true
            - name: logs
              mountPath: /var/log/bigbluebutton
            - name: tmp
              mountPath: /tmp
        {{- end }}
        {{- if $delivery }}
        # The transfer sidecar: rsyncs every finished tar in the handoff dir to the spool over
        # SSH and removes it on success (a failed transfer stays and is retried). rsync writes
        # the handoff tar through a temporary dotfile, so *.tar only matches finished files.
        # Runs as root inside its container: ssh refuses a uid without a passwd entry, and the
        # image has none for 998 (root also reads the tars whatever their owner).
        - name: spool-transfer
          image: {{ .Values.recording.scalelite.transferImage }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - sh
            - -c
            - |
              set -u
              opts="-i /ssh/id -p $SPOOL_PORT"
              if [ -f /ssh/known_hosts ]; then
                opts="$opts -o UserKnownHostsFile=/ssh/known_hosts -o StrictHostKeyChecking=yes"
              else
                opts="$opts -o UserKnownHostsFile=/tmp/known_hosts -o StrictHostKeyChecking=accept-new"
              fi
              echo "transferring tars from /var/bigbluebutton/spool to $SPOOL_DEST"
              while :; do
                for f in /var/bigbluebutton/spool/*.tar; do
                  [ -e "$f" ] || continue
                  echo "transferring $(basename "$f")"
                  rsync --verbose --remove-source-files -e "ssh $opts" "$f" "$SPOOL_DEST/" \
                    || echo "transfer of $(basename "$f") failed, retrying on the next pass"
                done
                sleep 15
              done
          env:
            - name: SPOOL_DEST
              value: {{ printf "%s:%s" .Values.recording.scalelite.spool.host (required "recording.scalelite.spool.path is empty" .Values.recording.scalelite.spool.path) | quote }}
            - name: SPOOL_PORT
              value: {{ .Values.recording.scalelite.spool.port | quote }}
            - name: HOME
              value: /tmp
          resources:
            {{- toYaml .Values.recording.scalelite.transferResources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/bigbluebutton
            - name: ssh
              mountPath: /ssh
              readOnly: true
            - name: transfer-tmp
              mountPath: /tmp
        {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bbb-data
        - name: recordings
          persistentVolumeClaim:
            claimName: bbb-recorder
        - name: config
          configMap:
            name: recording-config
        - name: props
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if $delivery }}
        - name: ssh
          secret:
            secretName: {{ .Values.recording.scalelite.sshKeySecret }}
            defaultMode: 0400
        - name: transfer-tmp
          emptyDir: {}
        {{- end }}
