apiVersion: v1
kind: Service
metadata:
  name: gql-actions
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "bbb.selector" "gql-actions" | nindent 4 }}
  ports:
    - name: http
      port: 8093
---
# bbb-graphql-actions: Hasura action handler that turns client mutations into Redis messages for
# akka-apps. It trusts the session variables in the request body, so only Hasura and the
# middleware may reach it (NetworkPolicy, spec D6).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gql-actions
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
    {{- include "bbb.selector" "gql-actions" | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "bbb.selector" "gql-actions" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bbb.podLabels" . | nindent 8 }}
        {{- include "bbb.selector" "gql-actions" | nindent 8 }}
    spec:
      {{- include "bbb.placement" (dict "root" . "role" .Values.graphqlActions.role) | nindent 6 }}
      {{- include "bbb.podDefaults" . | nindent 6 }}
      {{- include "bbb.podSecurityContext" (dict "user" 998) | nindent 6 }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      containers:
        - name: gql-actions
          image: {{ include "bbb.image" (dict "root" . "name" "graphql-actions" "tag" .Values.graphqlActions.tag) }}
          env:
            - name: BBB_REDIS_HOST
              value: redis
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: SERVER_PORT
              value: "8093"
          ports:
            - name: http
              containerPort: 8093
          # No health endpoint upstream (spec D10): TCP only.
          readinessProbe:
            tcpSocket:
              port: 8093
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8093
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.graphqlActions.resources | nindent 12 }}
          {{- include "bbb.containerSecurity" (dict "root" .) | nindent 10 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- include "bbb.scratch" (dict "name" "tmp" "size" "256Mi") | nindent 8 }}
