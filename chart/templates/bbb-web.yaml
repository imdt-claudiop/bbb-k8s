{{- define "bbb.webProperties" -}}
bigbluebutton.web.serverURL=https://{{ include "bbb.publicHost" . }}
redisHost=redis
redisPort=6379
# Written by the bbb-web package postinst (after-install.sh) over the war defaults.
placementsThreshold=800
imageTagThreshold=800
{{- range $k, $v := .Values.bbbWeb.properties }}
{{ $k }}={{ $v }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: bbb-web-config
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
data:
  # Template of /etc/bigbluebutton/bbb-web.properties; the setup init container appends securitySalt.
  bbb-web.properties: |
    {{- include "bbb.webProperties" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: bbb-web
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "bbb.selector" "bbb-web" | nindent 4 }}
  ports:
    - name: http
      port: 8090
---
# One replica, Recreate: bbb-web keeps meetings, sessions and tokens in memory (spec D9, L1).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bbb-web
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
    {{- include "bbb.selector" "bbb-web" | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "bbb.selector" "bbb-web" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bbb.labels" . | nindent 8 }}
        {{- include "bbb.selector" "bbb-web" | nindent 8 }}
      annotations:
        # The properties are rendered at start: restart bbb-web when they change. bbb-web holds
        # meetings in memory, so such a change ends them (spec L1): maintenance window.
        bbb-k8s/properties-sha: {{ include "bbb.webProperties" . | sha256sum | trunc 16 | quote }}
    spec:
      {{- include "bbb.nodeSelector" (dict "root" . "role" .Values.bbbData.role) | nindent 6 }}
      securityContext:
        runAsUser: 998
        runAsGroup: 998
        fsGroup: 998
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # The official image writes bbb-web.properties from its environment only when the file is
        # missing; the chart's file carries more (the properties above), so it is written here:
        # the template plus securitySalt from the Secret, into a file mounted by itself, which
        # keeps the image's /etc/bigbluebutton/nopdfmark.ps (read by the page downscaler)
        # visible. The same step creates the directory tree on the bbb-data volume.
        - name: setup
          image: {{ include "bbb.officialImage" (dict "root" . "name" "web") }}
          command:
            - sh
            - -c
            - |
              set -e
              { cat /etc/bigbluebutton-template/bbb-web.properties; printf '\nsecuritySalt=%s\n' "$SHARED_SECRET"; } > /props/bbb-web.properties
              {{ include "bbb.dataTree" . }}
              {{- if .Values.secrets.extraCA }}
              # The JVM's CAs plus secrets.extraCA, read by bbb-web through JAVA_TOOL_OPTIONS.
              cp "$JAVA_HOME/lib/security/cacerts" /trust/cacerts
              chmod u+w /trust/cacerts
              keytool -importcert -noprompt -alias extra-ca -file /extra-ca/ca.crt \
                -keystore /trust/cacerts -storepass changeit
              {{- end }}
          env:
            - name: SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.salt }}
                  key: security-salt
          volumeMounts:
            - name: config-template
              mountPath: /etc/bigbluebutton-template
            - name: props
              mountPath: /props
            - name: data
              mountPath: /var/bigbluebutton
            {{- if .Values.secrets.extraCA }}
            - name: trust
              mountPath: /trust
            - name: extra-ca
              mountPath: /extra-ca
              readOnly: true
            {{- end }}
      containers:
        - name: bbb-web
          # Heap: the image's JDK_JAVA_OPTIONS (-Xms384m -Xmx384m, those of bbb-web.service).
          image: {{ include "bbb.officialImage" (dict "root" . "name" "web") }}
          {{- if .Values.secrets.extraCA }}
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -Djavax.net.ssl.trustStore=/trust/cacerts -Djavax.net.ssl.trustStorePassword=changeit
          {{- end }}
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            tcpSocket:
              port: 8090
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8090
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
          resources:
            {{- toYaml .Values.bbbWeb.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/bigbluebutton
            - name: props
              mountPath: /etc/bigbluebutton/bbb-web.properties
              subPath: bbb-web.properties
              readOnly: true
            - name: client-settings
              mountPath: /usr/share/bigbluebutton/html5-client/private/config/settings.yml
              subPath: settings.yml
            - name: tmp
              mountPath: /tmp
            {{- if .Values.secrets.extraCA }}
            - name: trust
              mountPath: /trust
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bbb-data
        - name: config-template
          configMap:
            name: bbb-web-config
        - name: props
          emptyDir: {}
        - name: client-settings
          configMap:
            name: client-settings
        - name: tmp
          emptyDir: {}
        {{- if .Values.secrets.extraCA }}
        - name: trust
          emptyDir: {}
        - name: extra-ca
          secret:
            secretName: {{ .Values.secrets.extraCA }}
        {{- end }}
