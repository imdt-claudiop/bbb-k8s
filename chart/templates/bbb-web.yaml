{{- define "bbb.webProperties" -}}
bigbluebutton.web.serverURL=https://{{ include "bbb.publicHost" . }}
redisHost=redis
redisPort=6379
# Written by the bbb-web package postinst (after-install.sh) over the war defaults.
placementsThreshold=800
imageTagThreshold=800
{{- range $k, $v := .Values.bbbWeb.properties }}
{{ $k }}={{ $v }}
{{- end }}
{{- end }}
{{- define "bbb.webLogback" -}}
<?xml version="1.0" encoding="UTF-8"?>
<configuration>
  <appender name="STDOUT" class="ch.qos.logback.core.ConsoleAppender">
    <layout class="ch.qos.logback.classic.PatternLayout">
      <Pattern>%d{"yyyy-MM-dd'T'HH:mm:ss.SSSXXX"} %-5level %logger{35} - %msg%n</Pattern>
    </layout>
  </appender>

  <logger name="akka" level="INFO" />
  <logger name="io.lettuce" level="INFO" />
  <logger name="org.bigbluebutton" level="DEBUG" />

  <logger name="grails.app.controllers" level="DEBUG" />
  <logger name="grails.app.services" level="DEBUG" />

  <logger name="org.grails.web.servlet" level="ERROR" />
  <logger name="org.grails.web.pages" level="ERROR" />
  <logger name="org.grails.web.sitemesh" level="ERROR" />
  <logger name="org.grails.web.mapping.filter" level="ERROR" />
  <logger name="org.grails.web.mapping" level="ERROR" />
  <logger name="org.grails.commons" level="ERROR" />
  <logger name="org.springframework" level="ERROR" />

  <root level="ERROR">
    <appender-ref ref="STDOUT" />
  </root>
</configuration>
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: bbb-web-config
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
data:
  # Template of /etc/bigbluebutton/bbb-web.properties; the entrypoint appends securitySalt.
  bbb-web.properties: |
    {{- include "bbb.webProperties" . | nindent 4 }}
  # The war's logback.xml (bigbluebutton-web/grails-app/conf) without its FILE appender: in a
  # pod stdout is the log, which the kubelet rotates, while the file only filled an emptyDir.
  logback.xml: |
    {{- include "bbb.webLogback" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: bbb-web
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "bbb.selector" "bbb-web" | nindent 4 }}
  ports:
    - name: http
      port: 8090
---
# One replica, Recreate: bbb-web keeps meetings, sessions and tokens in memory (spec D9, L1).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bbb-web
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
    {{- include "bbb.selector" "bbb-web" | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "bbb.selector" "bbb-web" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bbb.podLabels" . | nindent 8 }}
        {{- include "bbb.selector" "bbb-web" | nindent 8 }}
        {{- include "bbb.storageGroupLabel" . | nindent 8 }}
      annotations:
        # The properties, logback and settings.yml are read at start: restart bbb-web when they
        # change. bbb-web holds meetings in memory, so such a change ends them (spec L1):
        # maintenance window.
        bbb-k8s/config-sha: {{ printf "%s%s%s" (include "bbb.webProperties" .) (include "bbb.webLogback" .) (include "bbb.clientSettingsDefaults" .) | sha256sum | trunc 16 | quote }}
    spec:
      {{- include "bbb.placement" (dict "root" . "role" .Values.bbbData.role) | nindent 6 }}
      {{- include "bbb.storageAffinity" . | nindent 6 }}
      {{- include "bbb.podDefaults" . | nindent 6 }}
      {{- include "bbb.podSecurityContext" (dict "user" 998 "fsGroup" 998) | nindent 6 }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      initContainers:
        # Without Redis the application context fails while the JVM keeps running: it neither
        # serves nor exits, and only the liveness probe would end it.
        {{- include "bbb.waitRedis" . | nindent 8 }}
      containers:
        - name: bbb-web
          image: {{ include "bbb.image" (dict "root" . "name" "bbb-web" "tag" .Values.bbbWeb.tag) }}
          env:
            - name: SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.salt }}
                  key: security-salt
            - name: INITIAL_HEAP_SIZE
              value: {{ .Values.bbbWeb.heap.initial | quote }}
            - name: MAX_HEAP_SIZE
              value: {{ .Values.bbbWeb.heap.max | quote }}
            # Logs to stdout only (the logback.xml of bbb-web-config, mounted with the template).
            - name: JAVA_OPTS
              value: "-Dlogging.config=/etc/bigbluebutton-template/logback.xml -Dlogback.configurationFile=/etc/bigbluebutton-template/logback.xml"
            # Read by run-in-systemd.sh, the wrapper of every presentation conversion.
            - name: BBB_PRESENTATION_CONVERSION_MEMORY_MAX
              value: {{ .Values.bbbWeb.conversionMemoryMax | quote }}
          ports:
            - name: http
              containerPort: 8090
          # TCP like the rest; the startup probe gives the JVM five minutes before liveness counts.
          startupProbe:
            tcpSocket:
              port: 8090
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8090
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8090
            periodSeconds: 30
            failureThreshold: 5
          resources:
            {{- toYaml .Values.bbbWeb.resources | nindent 12 }}
          {{- include "bbb.containerSecurity" (dict "root" .) | nindent 10 }}
          volumeMounts:
            - name: data
              mountPath: /var/bigbluebutton
            - name: config-template
              mountPath: /etc/bigbluebutton-template
            - name: etc
              mountPath: /etc/bigbluebutton
            - name: client-settings
              mountPath: /usr/share/bigbluebutton/html5-client/private/config/settings.yml
              subPath: settings.yml
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /usr/share/bbb-web/logs
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bbb-data
        - name: config-template
          configMap:
            name: bbb-web-config
        {{- include "bbb.scratch" (dict "name" "etc" "size" "64Mi") | nindent 8 }}
        - name: client-settings
          configMap:
            name: client-settings
        # Uploads and conversion scratch files.
        {{- include "bbb.scratch" (dict "name" "tmp" "size" "2Gi") | nindent 8 }}
        {{- include "bbb.scratch" (dict "name" "logs" "size" "256Mi") | nindent 8 }}
