# helm test bbb -n bbb: create, join, getMeetingInfo, getRecordings and end through the public
# host, then the html5 client and LiveKit signaling (chart/scripts/api-smoke.sh). The pod stays
# after every run (Completed or Error) until the next `helm test` replaces it; read its output
# with `kubectl -n bbb logs api-smoke`.
apiVersion: v1
kind: Pod
metadata:
  name: api-smoke
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
    {{- include "bbb.selector" "api-smoke" | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  enableServiceLinks: false
  automountServiceAccountToken: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
    runAsNonRoot: true
    runAsUser: 998
    runAsGroup: 998
  containers:
    - name: api-smoke
      # Any image with bash, curl and sha256sum; the official akka-apps image has them.
      image: {{ include "bbb.officialImage" (dict "root" . "name" "apps-akka") }}
      command: ["bash", "-c"]
      args:
        - {{ .Files.Get "scripts/api-smoke.sh" | toJson }}
      env:
        - name: PUBLIC_HOST
          value: {{ include "bbb.publicHost" . | quote }}
        - name: SHARED_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.salt }}
              key: security-salt
        {{- if .Values.secrets.extraCA }}
        - name: CURL_CA_BUNDLE
          value: /extra-ca/ca.crt
        {{- end }}
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { cpu: 500m, memory: 128Mi }
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: tmp
          mountPath: /tmp
        {{- if .Values.secrets.extraCA }}
        - name: extra-ca
          mountPath: /extra-ca
          readOnly: true
        {{- end }}
  volumes:
    - name: tmp
      emptyDir:
        sizeLimit: 64Mi
    {{- if .Values.secrets.extraCA }}
    - name: extra-ca
      secret:
        secretName: {{ .Values.secrets.extraCA }}
    {{- end }}
