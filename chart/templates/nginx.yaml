{{- define "bbb.nginxSite" -}}
server {
  listen 8080;
  server_name {{ include "bbb.publicHost" . }};
  access_log /dev/stdout;
  return 301 https://$host$request_uri;
}
server {
  listen 8443 ssl;
  http2 on;
  server_name {{ include "bbb.publicHost" . }};
  ssl_certificate     /etc/nginx/tls/tls.crt;
  ssl_certificate_key /etc/nginx/tls/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  access_log /dev/stdout;
  absolute_redirect off;

  # This variable is used instead of $scheme by bigbluebutton nginx include
  # files, so $scheme can be overridden in reverse-proxy configurations.
  set $real_scheme $scheme;

  # BigBlueButton assets and static content.
  location / {
    root   /var/www/bigbluebutton-default/assets;
    index  index.html index.htm;
    expires 1m;
  }

  include /usr/share/bigbluebutton/nginx/*.nginx;
}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: bbb-nginx-config
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
data:
  # The site of build/packages-template/bbb-html5/bigbluebutton.nginx, with TLS terminated here
  # as a bbb-install server does; mounted over the image's sites-available/bigbluebutton. The
  # location files live in /usr/share/bigbluebutton/nginx.
  bigbluebutton: |
    {{- include "bbb.nginxSite" . | nindent 4 }}
  # Replaces the image's Hasura balancer site (127.0.0.1:8185 in front of 127.0.0.1:8085): the
  # middleware reaches the hasura Service directly, and its "upstream hasura" would capture the
  # http://hasura:8085 of graphql.nginx.
  hasura-loadbalancer.conf: |
    # Not used here: the hasura Service is the balancer.
---
# The location files of the official bbb-nginx image with this chart's Service names
# (chart/files/nginx, written by scripts/sync-upstream.sh), mounted over the image's copies,
# which point at 127.0.0.1.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bbb-nginx-locations
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
data:
  {{- (.Files.Glob "files/nginx/*.nginx").AsConfig | nindent 2 }}
---
apiVersion: v1
kind: Service
metadata:
  name: bbb-nginx
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
  {{- with .Values.nginx.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.nginx.service.type }}
  {{- if eq .Values.nginx.service.type "LoadBalancer" }}
  externalTrafficPolicy: {{ .Values.nginx.service.externalTrafficPolicy }}
  {{- end }}
  selector:
    {{- include "bbb.selector" "bbb-nginx" | nindent 4 }}
  ports:
    - name: https
      port: 443
      targetPort: 8443
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bbb-nginx
  labels:
    {{- include "bbb.labels" . | nindent 4 }}
    {{- include "bbb.selector" "bbb-nginx" | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "bbb.selector" "bbb-nginx" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bbb.labels" . | nindent 8 }}
        {{- include "bbb.selector" "bbb-nginx" | nindent 8 }}
      annotations:
        # nginx reads its site and location files only at start: restart it when they change.
        bbb-k8s/site-sha: {{ printf "%s%s" (include "bbb.nginxSite" .) (.Files.Glob "files/nginx/*.nginx").AsConfig | sha256sum | trunc 16 | quote }}
    spec:
      {{- include "bbb.nodeSelector" (dict "root" . "role" .Values.bbbData.role) | nindent 6 }}
      # The bigbluebutton user: it reads the presentations, recordings and dashboard reports on
      # bbb-data, as before (the official image's default user is nginx, 101).
      securityContext:
        runAsUser: 998
        runAsGroup: 998
        fsGroup: 998
      containers:
        - name: nginx
          image: {{ include "bbb.officialImage" (dict "root" . "name" "nginx") }}
          ports:
            - name: https
              containerPort: 8443
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8443
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.nginx.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/bigbluebutton
              readOnly: true
            - name: site
              mountPath: /etc/nginx/sites-available/bigbluebutton
              subPath: bigbluebutton
            - name: site
              mountPath: /etc/nginx/sites-available/hasura-loadbalancer.conf
              subPath: hasura-loadbalancer.conf
            - name: locations
              mountPath: /usr/share/bigbluebutton/nginx
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bbb-data
        - name: site
          configMap:
            name: bbb-nginx-config
        - name: locations
          configMap:
            name: bbb-nginx-locations
        - name: tls
          secret:
            secretName: {{ .Values.nginx.tlsSecret }}
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
