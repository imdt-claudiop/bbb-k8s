# The controller in its own namespace (phase 2 spec, "Forma"): no state outside the CRD.
# Build the image with the repo root as context (the Dockerfile copies chart/).
apiVersion: v1
kind: Namespace
metadata: { name: bbb-k8s-controller }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: bbb-k8s-controller, namespace: bbb-k8s-controller }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: bbb-k8s-controller }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: bbb-k8s-controller }
subjects: [ { kind: ServiceAccount, name: bbb-k8s-controller, namespace: bbb-k8s-controller } ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: bbb-k8s-controller, namespace: bbb-k8s-controller }
spec:
  replicas: 1
  selector: { matchLabels: { app: bbb-k8s-controller } }
  template:
    metadata: { labels: { app: bbb-k8s-controller } }
    spec:
      serviceAccountName: bbb-k8s-controller
      # The image is PRIVATE on ghcr (the repository is private; the code never goes public):
      # docker build -f controller/Dockerfile -t ghcr.io/imdt-claudiop/bbb-k8s-controller:<sha> .
      # docker push ...; kubectl -n bbb-k8s-controller create secret docker-registry ghcr-pull ...
      # Add a nodeSelector for the cluster's shared-services pool so the controller never lands
      # on cell nodes (their taints already repel it; the selector pins it).
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: controller
          image: ghcr.io/imdt-claudiop/bbb-k8s-controller:latest  # pin a sha tag per deploy
          args: ["--vpc-cidr", "10.116.0.0/20"]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
