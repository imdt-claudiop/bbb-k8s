# Static checks of the chart and the shell scripts: the chart must lint and render to manifests
# the Kubernetes API accepts (the Cilium CRDs included, through the CRDs catalog). Nothing here
# needs a cluster; `helm test` (docs/install.md "Checking an install") covers a running one.
name: chart
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.1
      - name: helm lint
        run: helm lint --strict chart -n bbb -f clusters/doks-hackweek.yaml
      - name: render
        run: |
          mkdir -p out
          helm template bbb chart -n bbb -f clusters/doks-hackweek.yaml > out/default.yaml
      - name: kubeconform
        run: |
          docker run --rm -v "$PWD/out:/out:ro" ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /out/default.yaml
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.10.0 \
            scripts/*.sh chart/scripts/*.sh
